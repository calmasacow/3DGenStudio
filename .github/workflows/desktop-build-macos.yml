name: Desktop build · macOS

# Manual-only macOS build: Actions tab → "Desktop build · macOS" → Run workflow
# → pick a branch. Produces the arm64 .dmg and .zip as the `3dgenstudio-macos`
# artifact (Apple Silicon only — bpy 5.x has no macOS Intel wheel, see the mac
# section of electron-builder.yml), plus the `mac-diagnostics` artifact — the
# Gatekeeper/code-signing report described in docs/DESKTOP_BUILD.md. Run this
# one on its own when investigating a macOS install problem: the runner is an
# Apple Silicon Mac, so it answers signing questions without needing a Mac.
#
# The Run workflow button only appears once this file is on the DEFAULT branch
# (main) — that is a GitHub rule, not a config option. Until then, merge it or
# use the all-platforms desktop-build.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/desktop-build-platform.yml
    secrets: inherit
    with:
      runner: macos-latest
      build-script: dist:mac
      artifact-suffix: macos
