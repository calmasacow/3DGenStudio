name: Desktop build · all platforms

# Builds Windows, macOS and Linux installers in one run.
# - Push a tag like v1.3.3 to produce artifacts.
# - Or run manually from the Actions tab (workflow_dispatch).
#
# To build a single platform instead, run the per-platform workflow:
# "Desktop build · Windows" / "· macOS" / "· Linux". All four share one build
# recipe (desktop-build-platform.yml) — edit the steps there.
#
# Artifacts only — nothing is published to GitHub Releases. Download the
# installers from the workflow run's Artifacts section. See
# desktop-build-platform.yml for how to switch to publishing Releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# The three jobs are independent: one platform failing does not cancel the
# others (this replaces the old matrix's fail-fast: false).
jobs:
  windows:
    uses: ./.github/workflows/desktop-build-platform.yml
    secrets: inherit
    with:
      runner: windows-latest
      build-script: dist:win
      artifact-suffix: windows

  macos:
    uses: ./.github/workflows/desktop-build-platform.yml
    secrets: inherit
    with:
      runner: macos-latest
      build-script: dist:mac
      artifact-suffix: macos

  linux:
    uses: ./.github/workflows/desktop-build-platform.yml
    secrets: inherit
    with:
      runner: ubuntu-latest
      build-script: dist:linux
      artifact-suffix: linux
